# Previous publisher preserved in docs/legacy-workflows for migration review.
name: Legacy release entry point
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - run: |
          echo 'This repository uses validation-only policy. Run Quality gate or bash scripts/ci.sh.'
          exit 1
