name: Auto Approve PRs

# Trusted branch writers bootstrap from the branch; Dependabot and forks use default-branch metadata.
# Never check out or execute pull request code.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-approve:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch &&
        (github.event.pull_request.head.repo.full_name != github.repository ||
         github.event.pull_request.user.login == 'dependabot[bot]'))) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
      !github.event.pull_request.draft
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@368320994ed55ae68935dcadb4062000a4648b92 # main
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
      APPROVAL_PAT: ${{ secrets.APPROVAL_PAT }}
