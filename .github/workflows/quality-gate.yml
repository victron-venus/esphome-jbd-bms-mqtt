# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Quality gate
concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
'on':
  pull_request: {}
  merge_group: {}
  workflow_call: {}
  push:
    branches:
      - main
  schedule:
    - cron: 29 3 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check-0:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-1:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-2:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-3:
    uses: ./.github/workflows/trivy-fs.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-4:
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  workflow-contracts:
    name: CI configuration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: 'python3 -m pip install --only-binary=:all: PyYAML==6.0.3'
      - run: python3 scripts/workflow_contracts.py
  gate:
    name: CI gate
    needs:
      - check-0
      - check-1
      - check-2
      - check-3
      - check-4
      - workflow-contracts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation workflow
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          PY
