# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Quality gate
concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
'on':
  pull_request: {}
  merge_group: {}
  workflow_call:
    inputs:
      force-full:
        type: boolean
        default: false
        description: Require real validation for a release or explicit qualification
  push:
    branches:
      - main
  schedule:
    - cron: 29 3 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  scope:
    name: Change scope
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name
      == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Classify documentation and build inputs
        env:
          DOCUMENTATION_PATHS: '["GOVERNANCE.md"]'
          REQUIRED_PATHS: "[]"
          FORCE_FULL: ${{ inputs.force-full && 'true' || 'false' }}
        run: |
          args=()
          if [[ "$FORCE_FULL" == true ]]; then args+=(--force); fi
          python3 scripts/change_scope.py "${args[@]}" --documentation-paths-json "$DOCUMENTATION_PATHS" --required-paths-json "$REQUIRED_PATHS"
  check-0:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      actions: read
    needs:
      - scope
      - workflow-contracts
    if: ${{ needs.scope.outputs.run == 'true' }}
  check-1:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
    needs:
      - scope
      - workflow-contracts
    if: ${{ needs.scope.outputs.run == 'true' }}
  check-2:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    needs:
      - scope
      - workflow-contracts
  check-3:
    uses: ./.github/workflows/trivy-fs.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    needs:
      - scope
      - workflow-contracts
  check-4:
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read
      actions: read
    needs:
      - scope
      - workflow-contracts
    if: ${{ needs.scope.outputs.run == 'true' }}
  workflow-contracts:
    name: CI configuration contracts
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name
      == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: 'python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workflow-contracts.txt'
      - run: python3 scripts/workflow_contracts.py
      - run: python3 -m unittest discover -s .github/workflow-tests -p 'test_*.py'
    needs:
      - scope
  gate:
    name: CI gate
    needs:
      - scope
      - check-0
      - check-1
      - check-2
      - check-3
      - check-4
      - workflow-contracts
    if: ${{ always() }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name
      == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Require every validation workflow
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = ['check-0', 'check-1', 'check-2', 'check-3', 'check-4', 'scope', 'workflow-contracts']
          always = ['check-2', 'check-3', 'scope', 'workflow-contracts']
          if set(results) != set(expected):
              raise SystemExit('Validation job inventory differs')
          scope = results['scope']
          outputs = scope.get('outputs', {})
          run = outputs.get('run')
          if scope['result'] != 'success' or run not in {'true', 'false'}:
              raise SystemExit('Change scope did not succeed')
          if run == 'false' and outputs.get('reason') != 'documentation-only':
              raise SystemExit('Unproven documentation-only scope')
          failed = {}
          for name, value in results.items():
              wanted = 'success' if run == 'true' or name in always else 'skipped'
              if value['result'] != wanted:
                  failed[name] = {'actual': value['result'], 'expected': wanted}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          print('Documentation-only: required checks passed; build checks skipped.' if run == 'false' else 'All validation workflows passed.')
          PY
