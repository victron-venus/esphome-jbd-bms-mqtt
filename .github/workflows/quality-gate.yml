# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Quality gate
'on':
  pull_request: {}
  merge_group: {}
  workflow_call: {}
  push:
    branches:
      - main
  schedule:
    - cron: 29 3 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check-0:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-1:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-2:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-3:
    uses: ./.github/workflows/trivy-fs.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  gate:
    name: CI gate
    needs:
      - check-0
      - check-1
      - check-2
      - check-3
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation workflow
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          PY
