# Keep this filename and job ID: existing code-scanning analyses use this identity.
name: Scorecard supply-chain security
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 7 * * 2'
  branch_protection_rule: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2.4.4 uses GHCR; the retired action depended on the unavailable GCR image.
      - name: Run all Scorecard checks
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Refresh the existing code-scanning analyses
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: results.sarif
