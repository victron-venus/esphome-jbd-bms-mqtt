# Keep this filename and job ID: existing code-scanning analyses use this identity.
name: Scorecard supply-chain security
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 7 * * 2'
  branch_protection_rule: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout the reviewed fail-closed scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: victron-venus/venus-os-ci-toolkit
          ref: 6b6cc553a797a885f6942c2d04afc4ef8f8b110c
          path: .scorecard-toolkit
          persist-credentials: false
      - name: Set up the scanner build toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: .scorecard-toolkit/tools/scorecard-scan/go.sum
      - name: Build the scanner from checksum-pinned dependencies
        working-directory: .scorecard-toolkit/tools/scorecard-scan
        env:
          GOTOOLCHAIN: local
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/scorecard-scan" .
      - name: Require a complete Scorecard analysis
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.SCORECARD_TOKEN || github.token }}
        run: >-
          "$RUNNER_TEMP/scorecard-scan"
          -repo "$GITHUB_REPOSITORY"
          -commit "$GITHUB_SHA"
          -output "$GITHUB_WORKSPACE/results.sarif"
      - name: Refresh the existing code-scanning analyses
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
