name: CI

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  validate:
    name: ESPHome Config Validation & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [jbd-all-batteries.yaml, jbd-all-batteries1.yaml, jbd-all-batteries2.yaml]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ESPHome
        # These three pinned dependencies publish source distributions only.
        run: >-
          pip install --only-binary :all: --no-binary paho-mqtt,esptool,crcmod
          esphome==2026.8.2 paho-mqtt==1.6.1 esptool==5.3.1 crcmod==1.7

      - name: Compile with the local adapter and isolated dummy credentials
        env:
          CONFIG: ${{ matrix.config }}
        run: bash scripts/ci.sh compile "$CONFIG"
