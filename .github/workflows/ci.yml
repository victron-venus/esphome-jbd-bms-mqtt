name: CI

on:
  workflow_call:
permissions:
  contents: read

jobs:
  validate:
    name: ESPHome Config Validation & Compile
    # The compiler lock supports Linux only. ARC matches its scale-set name,
    # not legacy OS labels; this exact reserve pool is also Linux x64.
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (contains(fromJSON(vars.CI_RUNNER_LABELS || '[]'), 'linux') || contains(fromJSON(vars.CI_RUNNER_LABELS || '[]'), 'victron-reserve-ci-x64')) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [jbd-all-batteries.yaml, jbd-all-batteries1.yaml, jbd-all-batteries2.yaml]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the locked Linux compiler and build backends
        run: python scripts/install-esphome.py

      - name: Compile with the local adapter and isolated dummy credentials
        env:
          CONFIG: ${{ matrix.config }}
        run: bash scripts/ci.sh compile "$CONFIG"
