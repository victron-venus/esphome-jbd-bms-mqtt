name: Auto Merge PRs

# Same-repository PRs bootstrap from the branch; forks use trusted base metadata.
# Never check out or execute pull request code.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !github.event.pull_request.draft
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@bc821b480dbc0ee77ceb5a07b948c19408a428ae
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
