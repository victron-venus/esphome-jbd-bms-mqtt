# Read trusted base metadata only; do not check out or execute PR code.
name: Auto Merge PRs
'on':
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - edited
      - converted_to_draft
permissions:
  contents: read
concurrency:
  group: automerge-${{ github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}${{ ((github.event.action == 'unlabeled' && github.event.label.name == 'automerge') || github.event.action == 'converted_to_draft' || (github.event.action == 'edited' && github.event.changes.base)) && format('-withdrawal-{0}', github.run_id) || '' }}
  cancel-in-progress: false
jobs:
  auto-merge:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@427a937de66be398d624822e1af558c0e019e0df # main
    with:
      native-auto-merge: true
      required-status-checks: CodeQL,SonarCloud Code Analysis,Trivy
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
