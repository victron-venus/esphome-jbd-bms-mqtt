name: CodeRabbit Review Requests

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Open PR number to request a review for
        required: true
        type: string

permissions: {}

jobs:
  request-review:
    if: github.event.repository.private == false
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/coderabbit-review-reusable.yml@413248b9fdb724e787097c5c56802412a49e9467 # main
    with:
      pull-request-number: ${{ inputs.pull-request-number || '' }}
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
