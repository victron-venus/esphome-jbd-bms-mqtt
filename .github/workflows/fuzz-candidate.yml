name: RC fuzz assessment
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Explicit source candidate assessment
        type: choice
        required: true
        default: rc
        options: [rc]
permissions:
  contents: read
jobs:
  fuzz:
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@6f0bf114a398f9c2b7e5407042c3828a8cc28b40 # main
    with:
      toolkit-ref: 6f0bf114a398f9c2b7e5407042c3828a8cc28b40
      evidence-mode: candidate
