name: RC fuzz assessment
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Explicit source candidate assessment
        type: choice
        required: true
        default: rc
        options: [rc]
permissions:
  contents: read
jobs:
  fuzz:
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@a1068073ef4b60b52542cd48954a99b4bc0be008 # main
    with:
      toolkit-ref: a1068073ef4b60b52542cd48954a99b4bc0be008
      evidence-mode: candidate
