name: RC fuzz assessment
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Explicit source candidate assessment
        type: choice
        required: true
        default: rc
        options: [rc]
permissions:
  contents: read
jobs:
  fuzz:
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@42c1200e7ec4ce7ed32fa1c9e7492449b1f04b80 # main
    with:
      toolkit-ref: 42c1200e7ec4ce7ed32fa1c9e7492449b1f04b80
      evidence-mode: candidate
